[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-model-automator"
version = "0.1.0"
description = "Automate threat modeling service operations — Jira lifecycle, scheduling, findings tracking, AI triage"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Reginald Baraza", email = "reginaldbaraza-code@users.noreply.github.com"},
]
keywords = ["security", "threat-modeling", "jira", "automation", "devops"]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "sqlalchemy>=2.0",
    "jira>=3.5",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "httpx>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
